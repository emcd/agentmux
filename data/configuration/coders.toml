# coder definitions
format-version = 1

[[coders]]
id = 'claude'

[coders.tmux]
initial-command = 'claude'
resume-command = 'claude --resume {coder-session-id}'
prompt-regex = '(?ms)^[─-]{20,}\s+[>❯]\s+[─-]{20,}'
prompt-inspect-lines = 6
prompt-idle-column = 2

[[coders]]
id = 'codex'

[coders.tmux]
initial-command = 'codex'
resume-command = 'codex resume {coder-session-id}'
prompt-regex = '(?ms)^›.*\n\s*\n.*$'
prompt-inspect-lines = 3
prompt-idle-column = 2

[[coders]]
id = 'gemini'

[coders.tmux]
initial-command = 'gemini'
resume-command = 'gemini --resume {coder-session-id}'
prompt-regex = '(?ms)^\s*>\s+Type your message.*\n[▄]{20,}\n.*$'
prompt-inspect-lines = 3
prompt-idle-column = 3

[[coders]]
id = 'opencode'

[coders.tmux]
initial-command = 'opencode'
resume-command = 'opencode --session {coder-session-id}'
prompt-regex = '(?ms)^\s*┃\s*\n\s*╹▀{20,}\n\s+.*\bctrl\+p commands(?:\s+•\s+OpenCode\s+[\d.]+)?$'
prompt-inspect-lines = 10
prompt-idle-column = 5

[[coders]]
id = 'opencode-acp'

[coders.acp]
channel = 'stdio'
command = 'opencode acp'

# Illustrative per-coder Pty transport configuration. The project
# currently ships Tmux and ACP coders; a Pty coder is opt-in per
# coder entry and requires the `pty` Cargo feature at build time
# (`cargo build --features pty`). The validator rejects both
# `[coders.<id>.pty]` and `[coders.<id>.tmux]` (or both
# `[coders.<id>.pty]` and `[coders.<id>.acp]`) being set on the
# same coder entry.
#
# `term-protocol` selects the literal `TERM` env-var value the
# Pty transport sets when spawning the child. Defaults to
# `xterm-256color`. The supported values are: `xterm-256color`
# (default), `xterm-kitty`, `alacritty`, `foot`, `wezterm`,
# `screen-256color`. `xterm-kitty` advertises kitty-keyboard-protocol
# support to TUIs that honor it; whether TERM alone is sufficient
# to flip a TUI into kitty-protocol mode depends on the TUI's
# terminal emulation stack. The project's TUIs (claude, codex,
# gemini, opencode) detect terminal capabilities from TERM and
# adapt accordingly; see `tasks.md` §6.6 for the empirical
# ground truth on the live bundle.
#
# [[coders]]
# id = 'codex-pty'
#
# [coders.pty]
# initial-command = 'codex'
# resume-command = 'codex resume {coder-session-id}'
# prompt-regex = '(?m)^READY_MARKER'
# prompt-inspect-lines = 3
# cols = 120
# rows = 40
# prime-timeout-ms = 30000
# wedge-detection = true
# term-protocol = 'xterm-kitty'
