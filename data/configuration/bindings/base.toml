# The TUI's default bindings, read by the same parser that reads an operator's
# file (see `embedded_binding_preset`), through which the shipped-set parse
# check also reads this artifact. Every row is a bare action name speaking for
# both terminal classes: the defaults do not vary by keyboard-enhancement
# probe outcome, and a modified `Enter` invokes whatever its context binds to
# bare `Enter`. Rows are grouped under their context, and within a group
# declaration order is the order presentation reads them in.
#
# Typing lives on the context (`BindingContext::text_sink`), not in this
# table: no spelling here could name it, since `Type` renders but does not
# parse, and a row per character is not a thing a table can hold.

[bindings.global]
"ctrl+c" = "quit"
"f1" = "toggle-help-overlay"

[bindings.compose-to]
"f2" = "open-picker"
"f3" = "toggle-events-overlay"
"f4" = "toggle-mode"
"f5" = "open-bundle-picker"
"ctrl+r" = "refresh-recipients"
"ctrl+a" = "move-to-field-cursor-home"
"ctrl+e" = "move-to-field-cursor-end"
"ctrl+u" = "clear-to-field"
"ctrl+space" = "autocomplete-recipient"
"tab" = "cycle-next-focus"
"shift+tab" = "cycle-previous-focus"
"enter" = "accept-to-completion"
"shift+enter" = "accept-to-completion"
"ctrl+enter" = "accept-to-completion"
"up" = "move-previous-to-completion"
"down" = "move-next-to-completion"
"left" = "move-to-field-cursor-left"
"right" = "move-to-field-cursor-right"
"home" = "move-to-field-cursor-home"
"end" = "move-to-field-cursor-end"
"backspace" = "delete-compose-character"
"pgup" = "scroll-chat-history-page-up"
"pgdn" = "scroll-chat-history-page-down"

[bindings.compose-message]
"f2" = "open-picker"
"f3" = "toggle-events-overlay"
"f4" = "toggle-mode"
"f5" = "open-bundle-picker"
"ctrl+r" = "refresh-recipients"
"ctrl+a" = "move-message-cursor-home"
"ctrl+e" = "move-message-cursor-end"
"ctrl+j" = "insert-message-newline"
"tab" = "cycle-next-focus"
"shift+tab" = "cycle-previous-focus"
"enter" = "send-message"
"shift+enter" = "send-message"
"ctrl+enter" = "send-message"
"esc" = "snap-chat-history-to-latest"
"up" = "move-message-cursor-up"
"down" = "move-message-cursor-down"
"left" = "move-message-cursor-left"
"right" = "move-message-cursor-right"
"home" = "move-message-cursor-home"
"end" = "move-message-cursor-end"
"backspace" = "delete-compose-character"
"pgup" = "scroll-chat-history-page-up"
"pgdn" = "scroll-chat-history-page-down"

[bindings.interaction-write]
"f2" = "open-picker"
"f3" = "toggle-events-overlay"
"f4" = "toggle-mode"
"f5" = "open-bundle-picker"
"ctrl+r" = "refresh-recipients"
"ctrl+j" = "insert-raww-newline"
"enter" = "dispatch-raww"
"shift+enter" = "dispatch-raww"
"ctrl+enter" = "dispatch-raww"
"left" = "move-raww-cursor-left"
"right" = "move-raww-cursor-right"
"up" = "navigate-interaction-up"
"down" = "navigate-interaction-down"
"home" = "move-raww-cursor-home"
"end" = "move-raww-cursor-end"
"backspace" = "delete-raww-character"
"pgup" = "scroll-interaction-snapshot-page-up"
"pgdn" = "scroll-interaction-snapshot-page-down"

[bindings.interaction-choice]
"f2" = "open-picker"
"f3" = "toggle-events-overlay"
"f4" = "toggle-mode"
"f5" = "open-bundle-picker"
"ctrl+r" = "refresh-recipients"
"ctrl+j" = "insert-raww-newline"
"enter" = "resolve-choice-selected"
"shift+enter" = "resolve-choice-selected"
"ctrl+enter" = "resolve-choice-selected"
"left" = "move-previous-choice-request"
"right" = "move-next-choice-request"
"up" = "move-previous-choice-option"
"down" = "move-next-choice-option"
"c" = "resolve-choice-cancelled"
"C" = "resolve-choice-cancelled"
"backspace" = "delete-raww-character"
"pgup" = "scroll-interaction-snapshot-page-up"
"pgdn" = "scroll-interaction-snapshot-page-down"

[bindings.picker-bundles]
"esc" = "close-picker"
"f2" = "close-picker"
"f5" = "close-picker"
"f3" = "toggle-events-overlay"
"f4" = "toggle-mode"
"enter" = "commit-picker-bundle"
"shift+enter" = "commit-picker-bundle"
"ctrl+enter" = "commit-picker-bundle"
"tab" = "toggle-picker-focus"
"shift+tab" = "toggle-picker-focus"
"left" = "toggle-picker-focus"
"right" = "toggle-picker-focus"
"down" = "move-next-picker-selection"
"up" = "move-previous-picker-selection"
"backspace" = "delete-picker-filter-character"

