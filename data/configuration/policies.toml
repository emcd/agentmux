# authorization policy presets
format-version = 1
default = 'default'

[[policies]]
id = 'default'
description = 'Conservative same-bundle policy.'

[policies.controls]
find = 'self'
list = 'home'
look = 'home'
send = 'home'

[[policies]]
id = 'operator'
description = 'Operator policy with cross-namespace inspection/messaging and choice-decision and lifecycle capability.'

# An operator is a relay-wide (@GLOBAL) principal whose home namespace is GLOBAL.
# list/look/send/raww are therefore set to all so the operator can inspect,
# list, message, and raww into bundles (a bundle is not its home namespace, so
# home would confine it to GLOBAL). raww in particular needs all because
# the operator's home (GLOBAL) holds only relay-wide UI sessions, which reject
# raww as an unsupported target class — so every usable raww target is
# cross-namespace.
[policies.controls]
choose = 'home'
find = 'self'
list = 'all'
look = 'all'
raww = 'all'
send = 'all'
updown = 'home'

# Relay-wide credential administration requires the all tier: these
# operations mutate the relay-level principal store, so a namespace-relative
# home scope is insufficient.
[policies.controls.new]
peer = 'all'

[policies.controls.change]
psk = 'all'
