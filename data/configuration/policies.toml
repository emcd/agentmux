# agentmux authorization policy presets
format-version = 1
default = 'default'

[[policies]]
id = 'default'
description = 'Conservative same-bundle policy.'

[policies.controls]
find = 'self'
list = 'all:home'
look = 'all:home'
send = 'all:home'
raww = 'all:home'
grant = 'none'

# The `operator` preset grants the `grant` capability. Any session whose
# policy enables `grant` may resolve ACP permission requests through the MCP
# `grant` tool. Assign it only to coordination/decisioning lanes (for example
# `master` and `mcp`).
[[policies]]
id = 'operator'
description = 'Operator policy with permission-grant capability over home.'

[policies.controls]
find = 'self'
list = 'all:home'
look = 'all:home'
send = 'all:home'
raww = 'all:home'
grant = 'all:home'
