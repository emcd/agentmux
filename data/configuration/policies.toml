# authorization policy presets
format-version = 1
default = 'default'

[[policies]]
id = 'default'
description = 'Conservative same-bundle policy.'

[policies.controls]
find = 'self'
list = 'all:home'
look = 'all:home'
send = 'all:home'

[[policies]]
id = 'operator'
description = 'Operator policy with permission-grant and lifecycle capability over home.'

[policies.controls]
find = 'self'
grant = 'all:home'
list = 'all:home'
look = 'all:home'
raww = 'all:home'
send = 'all:home'
updown = 'all:home'

# Relay-wide credential administration requires the all:all tier: these
# operations mutate the relay-level principal store, so a namespace-relative
# all:home grant is insufficient.
[policies.controls.new]
peer = 'all:all'

[policies.controls.change]
psk = 'all:all'
