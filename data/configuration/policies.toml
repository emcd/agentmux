# agentmux authorization policy presets
format-version = 1
default = 'default'

[[policies]]
id = 'default'
description = 'Conservative same-bundle policy.'

[policies.controls]
find = 'self'
list = 'all:home'
look = 'all:home'
send = 'all:home'
raww = 'all:home'
grant = 'none'

# The `operator` preset is the only preset that enables `operator-class`.
# Sessions referencing it (via `policy = 'operator'` in their bundle entry)
# may register with relay `client_class = operator` and use the MCP
# `grant` tool to poll and resolve ACP permission requests. Assign it
# only to coordination/decisioning lanes (for example `master` and `mcp`).
[[policies]]
id = 'operator'
description = 'Operator policy with permission-grant capability over home.'

[policies.controls]
find = 'self'
list = 'all:home'
look = 'all:home'
send = 'all:home'
raww = 'all:home'
grant = 'all:home'
operator-class = true
