[package]
name = "agentmux"
version = "0.8.0"
edition = "2024"
rust-version = "1.90"
description = "Multi-agent coordination runtime with inter-agent messaging across CLI, MCP, tmux, and ACP."
license = "Apache-2.0"
repository = "https://github.com/emcd/agentmux"
homepage = "https://github.com/emcd/agentmux"
documentation = "https://docs.rs/agentmux"
readme = "README.md"
keywords = ["agent", "mcp", "cli", "tmux", "coordination"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**",
    "/data/configuration/*.toml",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[dependencies]
anyhow = "1.0.97"
base64 = "0.22.1"
crossterm = "0.28.1"
libc = "0.2.171"
libghostty-vt = { version = "=0.2.0", default-features = false, optional = true }
notify-debouncer-full = "0.7.0"
portable-pty = { version = "0.9.0", optional = true }
rand = { version = "0.9.2", features = ["os_rng"] }
ratatui = "0.29.0"
rmcp = { version = "1.7.0", features = ["transport-io"] }
regex = "1.11.1"
schemars = "1.0.4"
shell-words = { version = "1.1.1", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
subtle = "2.6.1"
time = { version = "0.3.41", features = ["formatting", "parsing"] }
tokio = { version = "1.44.1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
toml = "0.8.23"
uuid = { version = "1.18.1", features = ["v4"] }

[features]
# Default-off feature gating the Pty transport and its bindings.
# `cargo build` does not pull libghostty-vt / portable-pty and does not
# invoke Zig. `cargo build --features pty` enables the Pty transport,
# its bin target, and its vendored libghostty-vt build chain (which
# requires Zig 0.15.x on PATH and a network clone of ghostty at build
# time, or `GHOSTTY_SOURCE_DIR` / `GHOSTTY_ZIG_SYSTEM_DIR` overrides).
default = []
pty = ["dep:libghostty-vt", "dep:portable-pty", "dep:shell-words"]

[[bin]]
name = "agentmux-acp"
path = "src/bin/agentmux_acp.rs"

[[bin]]
name = "agentmux-pty"
path = "src/bin/agentmux_pty.rs"
required-features = ["pty"]

[dev-dependencies]
tempfile = "3.18.0"

[lints.clippy]
# Catch std::sync::Mutex / RwLock guards held across `.await` points. Such a
# guard would pin a tokio runtime worker thread on a synchronous lock acquired
# by any other task on the same lock, defeating the slice-4 async conversion.
# Enforced as `deny` so the build fails on a regression rather than only
# emitting a warning. Use a scoped block (`{ let g = mutex.lock(); ... }`) or
# move the critical section into `spawn_blocking` if a needed case appears.
await_holding_lock = "deny"
