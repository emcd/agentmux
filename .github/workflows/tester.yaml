name: qa

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['master', 'release-*']
  workflow_dispatch: {}

jobs:

  initialize:
    uses: ./.github/workflows/core--initializer.yaml

  lint:
    needs: [initialize]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint Generated Client Configuration
        # Needs no toolchain, so it runs before the Rust setup: a committed
        # --state-directory in a coder client configuration fails here in
        # seconds rather than after a build.
        run: scripts/lint-client-configuration.sh

      - name: Install Rust
        # Brought forward so `cargo install linecheck` below has a toolchain
        # to build from. The previous ordering (Rust later) was correct when
        # the only Rust-using steps were fmt/clippy/nextest; linecheck now
        # joins them.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install linecheck
        # Pinned to the same version this project develops against locally.
        # `linecheck` is not a repository dependency (it is not a runtime
        # dependency of the crate and is not in `Cargo.toml`), so the host
        # runner must install it explicitly. Bumping the version is a workflow
        # edit, intentionally separate from a hook change, so a binary
        # upgrade does not silently widen enforcement.
        run: cargo install linecheck --locked --version 1.2.1

      - name: Check Line Counts
        # Mirrors the pre-commit `linecheck` hook. Runs after `linecheck`
        # itself is installed (the step above) and before any later Rust
        # hook, so a 1000-line commit attempt fails in seconds rather than
        # after a full Rust toolchain setup.
        run: linecheck --config .auxiliary/configuration/linecheck.yaml src tests

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Install Zig
        # Required so the next step's `scripts/clippy-pty.sh` can run.
        # Pinned to 0.15.2 to match the test job's `pty-feature` row;
        # the lint job has no matrix dimension so this is unconditional.
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Run Clippy (default features)
        # Default-features lint only. The `pty` feature is intentionally
        # excluded; it requires Zig + outbound network. Lint with pty
        # enabled via the next step (CLIPPY_PTY_REQUIRE=1 makes it
        # fail-closed in CI; locally the helper skips without Zig).
        run: cargo clippy --all-targets --features "" -- -D warnings

      - name: Run Clippy (pty feature)
        env:
          CLIPPY_PTY_REQUIRE: '1'
        run: scripts/clippy-pty.sh

  test:
    needs: [initialize, lint]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.initialize.outputs.platforms) }}
        exclude: ${{ fromJSON(needs.initialize.outputs.matrix-exclusions) }}
        include:
          - id: pty-feature
            platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Verify tmux Presence
        # Reports tmux availability on each runner after the macOS install
        # step above. macOS previously had no tmux on PATH; the install step
        # above restores it. Ubuntu runners already ship tmux 3.4.
        run: |
          which tmux || echo "tmux: not found on PATH"
          tmux -V || echo "tmux: found on PATH but -V failed"

      - name: Install Zig
        if: matrix.id == 'pty-feature'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9

      - name: Build
        run: cargo build --release ${{ matrix.id == 'pty-feature' && '--features pty' || '' }}

      - name: Test
        env:
          RUST_BACKTRACE: '1'
        run: cargo nextest run --release --locked --config-file .auxiliary/configuration/nextest.toml ${{ matrix.id == 'pty-feature' && '--features pty' || '' }}
