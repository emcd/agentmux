# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_install_hook_types: [ 'pre-commit', 'pre-push' ]

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    - id: check-added-large-files
      name: 'Check: Large Files'
    - id: check-case-conflict
      name: 'Check: Filename Case Conflict'
    - id: check-merge-conflict
      name: 'Check: Merge Conflict Markers'
    - id: check-symlinks
      name: 'Check: Dangling Symlinks'
    - id: check-vcs-permalinks
      name: 'Check: VCS Permalinks'
    - id: destroyed-symlinks
      name: 'Check: Destroyed Symlinks'
    - id: detect-private-key
      name: 'Check: Detect Private Keys'
    - id: mixed-line-ending
      name: 'Check: Detect Mixed Line Endings'
      args: [ '--fix', 'no' ]
    - id: check-json
      name: 'Validate: JSON Files'
    - id: check-toml
      name: 'Validate: TOML Files'
    - id: check-yaml
      name: 'Validate: YAML Files'

- repo: local
  hooks:

    - id: lint-client-configuration
      name: 'Lint: Generated Client Configuration'
      # Asserts a property of committed artifacts rather than behavior of the
      # crate, so it is a lint and not a test. Runs unconditionally (it is a
      # grep over three files) and first, so the cheap repository check reports
      # before the expensive Rust hooks.
      language: system
      entry: 'scripts/lint-client-configuration.sh'
      pass_filenames: false
      require_serial: true
      stages: [ 'pre-commit' ]
      fail_fast: true

    - id: cargo-fmt
      name: 'Check Style (Rust)'
      language: system
      entry: 'cargo fmt --all -- --check'
      pass_filenames: false
      require_serial: true
      stages: [ 'pre-commit' ]
      fail_fast: true

    - id: cargo-clippy
      name: 'Lint (Rust: Clippy)'
      # Default-features lint only. The `pty` feature is intentionally
      # excluded because it requires Zig 0.15.x + outbound network for
      # the libghostty-vt vendored ghostty clone (or GHOSTTY_SOURCE_DIR
      # override). Lint Pty sources via the `cargo-clippy-pty` hook
      # below. To add a new feature to default-features lint, append
      # its name to --features here.
      language: system
      entry: 'cargo clippy --all-targets --features "" -- -D warnings'
      pass_filenames: false
      require_serial: true
      stages: [ 'pre-commit' ]
      fail_fast: true

    - id: cargo-clippy-pty
      name: 'Lint Pty Transport (Rust: Clippy, requires Zig 0.15.x)'
      language: system
      entry: 'scripts/clippy-pty.sh'
      pass_filenames: false
      require_serial: true
      stages: [ 'pre-commit' ]
      files: '^(src/pty/|src/bin/agentmux_pty\.rs|Cargo\.toml|Cargo\.lock)'
      fail_fast: false

    - id: cargo-nextest
      name: 'Test (Rust, cargo-nextest)'
      language: system
      entry: 'cargo nextest run --locked --config-file .auxiliary/configuration/nextest.toml'
      pass_filenames: false
      require_serial: true
      stages: [ 'pre-commit' ]
      fail_fast: true

    - id: cargo-build
      name: 'Compile (Rust: Release)'
      language: system
      entry: 'cargo build --release --locked'
      pass_filenames: false
      require_serial: true
      stages: [ 'pre-push' ]
      always_run: true
      fail_fast: true

    - id: cargo-nextest-release
      name: 'Test (Rust: Release, cargo-nextest)'
      language: system
      entry: 'cargo nextest run --release --locked --config-file .auxiliary/configuration/nextest.toml'
      pass_filenames: false
      require_serial: true
      stages: [ 'pre-push' ]
      always_run: true
      fail_fast: true

    # Generation-fence tests that are ignored by default because they cost tens
    # of seconds each -- holding a bootstrap open across a signal is inherently
    # slow, and paying for it on every commit is the wrong trade. Selected by
    # module rather than by test name, so a slow fence test added alongside them
    # is picked up without editing this entry. Deliberately NOT `--run-ignored
    # ignored-only` across the whole suite: most ignored tests are ignored
    # because they are blocked on unimplemented work, not because they are slow,
    # and running those here would fail every push.
    - id: cargo-nextest-generation-fence
      name: 'Test (Rust: Generation Fence, slow)'
      language: system
      entry: >-
        cargo nextest run --locked
        --config-file .auxiliary/configuration/nextest.toml
        --run-ignored ignored-only
        -E 'test(/^acp::generation_fence::/)'
      pass_filenames: false
      require_serial: true
      stages: [ 'pre-push' ]
      always_run: true
      fail_fast: true
