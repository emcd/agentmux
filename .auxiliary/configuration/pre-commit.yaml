# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_install_hook_types: [ 'pre-commit', 'pre-push' ]

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    - id: check-added-large-files
      name: 'Check: Large Files'
    - id: check-case-conflict
      name: 'Check: Filename Case Conflict'
    - id: check-merge-conflict
      name: 'Check: Merge Conflict Markers'
    - id: check-symlinks
      name: 'Check: Dangling Symlinks'
    - id: check-vcs-permalinks
      name: 'Check: VCS Permalinks'
    - id: destroyed-symlinks
      name: 'Check: Destroyed Symlinks'
    - id: detect-private-key
      name: 'Check: Detect Private Keys'
    - id: mixed-line-ending
      name: 'Check: Detect Mixed Line Endings'
      args: [ '--fix', 'no' ]
    - id: check-json
      name: 'Validate: JSON Files'
    - id: check-toml
      name: 'Validate: TOML Files'
    - id: check-yaml
      name: 'Validate: YAML Files'

- repo: local
  hooks:

    - id: lint-client-configuration
      name: 'Lint: Generated Client Configuration'
      # Asserts a property of committed artifacts rather than behavior of the
      # crate, so it is a lint and not a test. Runs unconditionally (it is a
      # grep over three files) and first, so the cheap repository check reports
      # before the expensive Rust hooks.
      language: system
      entry: 'scripts/lint-client-configuration.sh'
      pass_filenames: false
      require_serial: true
      stages: [ 'pre-commit' ]
      fail_fast: true

    - id: lint-openspec-deltas
      name: 'Lint: OpenSpec Delta Retention'
      # Asserts agreement between the delta specs being committed and the live
      # specs they modify -- a property of committed artifacts, so a lint and not
      # a test. Grouped with the other cheap repository check, ahead of the
      # expensive Rust hooks.
      #
      # Scoped by `files` to the changes a commit actually touches rather than
      # every active change. The retention report is idempotent -- it reports the
      # same drops on every commit until the change archives -- so auditing all
      # of them would print one lane's report on every commit in the repository
      # and train everyone to skim past it.
      #
      # `verbose` is load-bearing, not decoration. The check this hook exists for
      # -- a MODIFIED delta silently deleting scenarios it failed to carry
      # forward -- is a report and not an error, because dropping a scenario is
      # often exactly right. A report that pre-commit swallows on success would
      # reproduce the original failure, so the output must print on a pass.
      language: system
      entry: 'scripts/verify-openspec-deltas.py'
      files: '^(documentation/architecture/)?openspec/changes/[^/]+/specs/.*\.md$'
      require_serial: true
      stages: [ 'pre-commit' ]
      verbose: true
      fail_fast: true

    - id: linecheck
      name: 'Check: Line Counts'
      # Pre-commit's `always_run: true` fires the gate on every commit
      # regardless of which files the commit touches, so the rule cannot be
      # bypassed by a commit whose `.rs` files happen to all be in-limit while
      # another branch grows an over-limit module separately. `pass_filenames:
      # false` keeps `linecheck` in charge of its own file selection -- the
      # config under `.auxiliary/configuration/linecheck.yaml` scopes the
      # patterns to `src/**/*.rs` and `tests/**/*.rs` and an `exclude:` list
      # opts markdown, generated build artifacts, and vendored sources out
      # of `linecheck`'s built-in default fallback. See
      # `documentation/development-practices.md` for the rationale, the
      # 800/999 thresholds, and the no-exception rule that makes the cap a
      # mechanical gate rather than a prose convention.
      language: system
      entry: 'linecheck --config .auxiliary/configuration/linecheck.yaml src tests'
      pass_filenames: false
      always_run: true
      require_serial: true
      stages: [ 'pre-commit' ]
      fail_fast: true

    - id: cargo-fmt
      name: 'Check Style (Rust)'
      language: system
      entry: 'cargo fmt --all -- --check'
      pass_filenames: false
      require_serial: true
      stages: [ 'pre-commit' ]
      fail_fast: true

    - id: cargo-clippy
      name: 'Lint (Rust: Clippy)'
      # Default-features lint only. The `pty` feature is intentionally
      # excluded because it requires Zig 0.15.x + outbound network for
      # the libghostty-vt vendored ghostty clone (or GHOSTTY_SOURCE_DIR
      # override). Lint Pty sources via the `cargo-clippy-pty` hook
      # below. To add a new feature to default-features lint, append
      # its name to --features here.
      language: system
      entry: 'cargo clippy --all-targets --features "" -- -D warnings'
      pass_filenames: false
      require_serial: true
      stages: [ 'pre-commit' ]
      fail_fast: true

    - id: cargo-clippy-pty
      name: 'Lint Pty Transport (Rust: Clippy, requires Zig 0.15.x)'
      language: system
      entry: 'scripts/clippy-pty.sh'
      pass_filenames: false
      require_serial: true
      stages: [ 'pre-commit' ]
      files: '^(src/pty/|src/bin/agentmux_pty\.rs|Cargo\.toml|Cargo\.lock)'
      fail_fast: false

    - id: cargo-nextest
      name: 'Test (Rust, cargo-nextest)'
      language: system
      entry: 'cargo nextest run --locked --config-file .auxiliary/configuration/nextest.toml'
      pass_filenames: false
      require_serial: true
      stages: [ 'pre-commit' ]
      fail_fast: true

    - id: cargo-build
      name: 'Compile (Rust: Release)'
      language: system
      entry: 'cargo build --release --locked'
      pass_filenames: false
      require_serial: true
      stages: [ 'pre-push' ]
      always_run: true
      fail_fast: true

    - id: cargo-nextest-release
      name: 'Test (Rust: Release, cargo-nextest)'
      language: system
      entry: 'cargo nextest run --release --locked --config-file .auxiliary/configuration/nextest.toml'
      pass_filenames: false
      require_serial: true
      stages: [ 'pre-push' ]
      always_run: true
      fail_fast: true
